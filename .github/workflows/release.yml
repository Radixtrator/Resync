# Builds a signed release APK and publishes it as a GitHub release whenever a version tag is pushed:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Obtainium watches this repo's releases and offers each new one as an update. Tags with a suffix
# (v0.2.0-beta.1) are published as pre-releases, which Obtainium skips unless "Include prereleases" is on.
#
# Needs four repository secrets (Settings > Secrets and variables > Actions), see README "Releases":
#   RESYNC_KEYSTORE_BASE64, RESYNC_KEYSTORE_PASSWORD, RESYNC_KEY_ALIAS, RESYNC_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resync
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          name="${tag#v}"
          if [[ ! "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-.+)?$ ]]; then
            echo "::error::Tag $tag isn't vMAJOR.MINOR.PATCH[-suffix]"; exit 1
          fi
          # 1.2.3 -> 10203: always grows with the version, as Android's versionCode must.
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ -n "${BASH_REMATCH[4]}" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the long-removed "tools" package, which current sdkmanager rejects.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RESYNC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RESYNC_KEYSTORE_BASE64 secret is missing; refusing to publish an unsigned APK"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Test and build
        env:
          RESYNC_KEYSTORE: ${{ runner.temp }}/release.keystore
          RESYNC_KEYSTORE_PASSWORD: ${{ secrets.RESYNC_KEYSTORE_PASSWORD }}
          RESYNC_KEY_ALIAS: ${{ secrets.RESYNC_KEY_ALIAS }}
          RESYNC_KEY_PASSWORD: ${{ secrets.RESYNC_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ steps.version.outputs.code }}
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/resync-${GITHUB_REF_NAME}.apk"
          # R8's mapping, to turn a crash report's obfuscated names back into real ones (retrace).
          cp app/build/outputs/mapping/release/mapping.txt "$RUNNER_TEMP/mapping-${GITHUB_REF_NAME}.txt"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/resync-${{ github.ref_name }}.apk
            ${{ runner.temp }}/mapping-${{ github.ref_name }}.txt
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          body: |
            **Install or update:** add `https://github.com/Radixtrator/Resync` in [Obtainium](https://github.com/ImranR98/Obtainium) to get updates automatically ([steps](https://github.com/Radixtrator/Resync#install)), or download the APK below.
          generate_release_notes: true
